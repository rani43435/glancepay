<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Ambient Video</title>
<style>
  /* On the glasses black is see-through, so only the video and its glow show. */
  :root { --fg: #F2F2EF; --dim: #9A9DA4; --line: #34373D; --accent: #7FE3B0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }

  /* The glow: a tiny copy of the frame, stretched and blurred behind the video */
  #glow {
    position: absolute; width: calc(var(--size) * 1vw); aspect-ratio: var(--ratio);
    transform: scale(var(--spread)); opacity: var(--amount); pointer-events: none;
    /* No CSS blur (too heavy for the Pocket TV): a tiny canvas stretched up is
       already soft, and a static mask fades its edges out. */
    -webkit-mask-image: radial-gradient(closest-side, #000 68%, transparent);
    mask-image: radial-gradient(closest-side, #000 68%, transparent);
  }
  #video {
    position: relative; width: calc(var(--size) * 1vw); max-height: 96vh; aspect-ratio: var(--ratio);
    background: #000; border-radius: 6px; display: block;
  }

  /* Start screen */
  #pick { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
  #pick[hidden] { display: none; }
  .title { font-size: 34px; font-weight: 600; letter-spacing: .5px; }
  .sub { font-size: 18px; color: var(--dim); }

  /* Controls: show on any touch/move, hide after 3 s */
  #bar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(900px, 94vw);
    display: flex; flex-direction: column; gap: 10px; padding: 12px 18px;
    background: rgba(20,21,24,.88); border: 1px solid var(--line); border-radius: 22px;
    transition: opacity .3s;
  }
  .seek { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .seek input { flex: 1; width: auto; }
  .btns { display: flex; align-items: center; gap: 12px; }
  .gap { flex: 1; }
  .btn.round { display: flex; align-items: center; gap: 2px; padding: 0 14px; flex: none; }
  .btn.round.big { width: 56px; height: 56px; padding: 0; justify-content: center; border-color: var(--accent); }
  .btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn.big svg { stroke: var(--accent); }
  .btn.big:focus-visible svg { stroke: #000; }
  .btn b { font-size: 14px; }
  body.idle #bar { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }
  .btn {
    font: inherit; font-size: 17px; font-weight: 600; color: var(--fg); background: transparent;
    border: 1.5px solid var(--line); border-radius: 999px; min-height: 44px; padding: 0 18px; cursor: pointer; white-space: nowrap;
  }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn:focus { outline: none; }
  .btn:focus-visible { background: var(--fg); color: #000; border-color: var(--fg); }
  label.ctl { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--dim); }
  input[type=range] { width: 110px; accent-color: var(--accent); }
  #file { display: none; }
</style>
</head>
<body>
<div id="stage" style="--size:72;--ratio:16/9;--spread:1.8;--amount:1">
  <canvas id="glow" width="12" height="7"></canvas>
  <video id="video" playsinline></video>
</div>

<div id="pick">
  <div class="title">Ambient Video</div>
  <div class="sub">Pick a video from this device</div>
  <button class="btn primary" id="open" autofocus>Choose video</button>
</div>

<div id="bar" hidden>
  <div class="seek">
    <span id="cur">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position">
    <span id="dur">0:00</span>
  </div>
  <div class="btns">
    <button class="btn round" id="back" aria-label="Back 10 seconds">
      <svg viewBox="0 0 24 24"><path d="M11 6L5 12l6 6"/><path d="M19 6l-6 6 6 6"/></svg><b>10</b>
    </button>
    <button class="btn round big" id="play" aria-label="Pause">
      <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14M16 5v14"/></svg>
    </button>
    <button class="btn round" id="fwd" aria-label="Forward 10 seconds">
      <b>10</b><svg viewBox="0 0 24 24"><path d="M5 6l6 6-6 6"/><path d="M13 6l6 6-6 6"/></svg>
    </button>
    <span class="gap"></span>
    <label class="ctl">Glow <input type="range" id="amount" min="0" max="100" value="100"></label>
    <label class="ctl">Size <input type="range" id="size" min="35" max="95" value="72"></label>
    <button class="btn" id="open2">Other video</button>
    <button class="btn" id="full">Full screen</button>
  </div>
</div>

<input type="file" id="file" accept="video/*">

<script>
// Ambient Video: plays a local video and lights up the space around it with the
// colours at the edge of the picture (an Ambilight). Each frame is drawn into a
// 12x7 canvas behind the video; stretched up, it becomes the glow.
const $ = (id) => document.getElementById(id);
const video = $('video'), glow = $('glow'), stage = $('stage');
const g = glow.getContext('2d', { alpha: false });
g.filter = 'saturate(2) brightness(1.35)';
let last = 0;
let url = null;

function openPicker() { $('file').click(); }
$('open').onclick = openPicker;
$('open2').onclick = openPicker;

$('file').onchange = () => {
  const f = $('file').files[0];
  if (!f) return;
  if (url) URL.revokeObjectURL(url);
  url = URL.createObjectURL(f);
  video.src = url;
  video.play();
  $('pick').hidden = true;
  $('bar').hidden = false;
  wake();
};

video.onloadedmetadata = () => {
  if (video.videoWidth) stage.style.setProperty('--ratio', video.videoWidth + '/' + video.videoHeight);
};

// Draw the current frame into the glow, every frame the video shows.
// ~12 updates a second is plenty for a glow and keeps the device cool.
function paint() {
  const now = performance.now();
  if (video.readyState >= 2 && !video.paused && now - last > 80) {
    g.drawImage(video, 0, 0, glow.width, glow.height);
    last = now;
  }
  if ('requestVideoFrameCallback' in video) video.requestVideoFrameCallback(paint);
  else requestAnimationFrame(paint);
}
paint();

// Controls
$('play').onclick = () => (video.paused ? video.play() : video.pause());
const PAUSE = '<path d="M8 5v14M16 5v14"/>', PLAY = '<path d="M7 5l12 7-12 7z"/>';
video.onplay = () => { $('playIcon').innerHTML = PAUSE; $('play').setAttribute('aria-label', 'Pause'); };
video.onpause = () => { $('playIcon').innerHTML = PLAY; $('play').setAttribute('aria-label', 'Play'); wake(); };
$('back').onclick = () => (video.currentTime = Math.max(0, video.currentTime - 10));
$('fwd').onclick = () => (video.currentTime = Math.min(video.duration || 0, video.currentTime + 10));

// Position bar
const fmt = (t) => { t = Math.floor(t || 0); const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
let dragging = false;
video.ontimeupdate = () => {
  $('cur').textContent = fmt(video.currentTime);
  if (!dragging && video.duration) $('seek').value = (video.currentTime / video.duration) * 1000;
};
video.ondurationchange = () => ($('dur').textContent = fmt(video.duration));
$('seek').oninput = (e) => { dragging = true; if (video.duration) { video.currentTime = (e.target.value / 1000) * video.duration; $('cur').textContent = fmt(video.currentTime); } };
$('seek').onchange = () => (dragging = false);
$('amount').oninput = (e) => stage.style.setProperty('--amount', e.target.value / 100);
$('size').oninput = (e) => stage.style.setProperty('--size', e.target.value);
$('full').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};
document.addEventListener('fullscreenchange', () => {
  $('full').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
});

// Hide controls after 3 s without input
let idleT;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleT);
  idleT = setTimeout(() => { if (!video.paused) document.body.classList.add('idle'); }, 3000);
}
['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach((ev) => document.addEventListener(ev, wake, { passive: true }));

// Remote / keyboard: Space or Enter on the video toggles play, arrows seek
document.addEventListener('keydown', (e) => {
  if ($('pick').hidden === false) return;
  if (e.key === ' ' && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); $('play').click(); }
  if (e.key === 'ArrowRight' && e.target.type !== 'range') video.currentTime += 10;
  if (e.key === 'ArrowLeft' && e.target.type !== 'range') video.currentTime -= 10;
});
</script>
</body>
</html>
