<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Ambient Video</title>
<style>
  /* On the glasses black is see-through, so only the video and its glow show. */
  :root { --fg: #F2F2EF; --dim: #9A9DA4; --line: #34373D; --accent: #7FE3B0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }

  /* The glow: a tiny copy of the frame, stretched and blurred behind the video */
  #glow {
    position: absolute; width: calc(var(--size) * 1vw); aspect-ratio: var(--ratio);
    transform: scale(var(--spread)); opacity: var(--amount); pointer-events: none;
    /* No CSS blur (too heavy for the Pocket TV): a tiny canvas stretched up is
       already soft, and a static mask fades its edges out. */
    -webkit-mask-image: radial-gradient(closest-side, #000 68%, transparent);
    mask-image: radial-gradient(closest-side, #000 68%, transparent);
  }
  #video, #yt {
    position: relative; width: calc(var(--size) * 1vw); max-height: 96vh; aspect-ratio: var(--ratio);
    background: #000; border-radius: 6px; display: block;
  }

  /* Start screen */
  #pick { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
  #pick[hidden], #bar[hidden] { display: none; }
  .title { font-size: 34px; font-weight: 600; letter-spacing: .5px; }
  .sub { font-size: 18px; color: var(--dim); }

  /* Controls: show on any touch/move, hide after 3 s */
  #bar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(1000px, 96vw);
    display: flex; flex-direction: column; gap: 10px; padding: 12px 18px;
    background: rgba(20,21,24,.88); border: 1px solid var(--line); border-radius: 22px;
    transition: opacity .3s;
  }
  .seek { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .seek input { flex: 1; width: auto; }
  .btns { display: flex; align-items: center; gap: 12px; }
  .gap { flex: 1; }
  .btn.round { display: flex; align-items: center; gap: 2px; padding: 0 14px; flex: none; }
  .btn.round.big { width: 56px; height: 56px; padding: 0; justify-content: center; border-color: var(--accent); }
  .btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn.big svg { stroke: var(--accent); }
  .btn.big:focus-visible svg { stroke: #000; }
  .btn b { font-size: 14px; }
  body.idle #bar { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }
  .btn {
    font: inherit; font-size: 17px; font-weight: 600; color: var(--fg); background: transparent;
    border: 1.5px solid var(--line); border-radius: 999px; min-height: 44px; padding: 0 18px; cursor: pointer; white-space: nowrap;
  }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn:focus { outline: none; }
  .btn:focus-visible { background: var(--fg); color: #000; border-color: var(--fg); }
  label.ctl { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--dim); }
  input[type=range] { width: 90px; accent-color: var(--accent); }
  #file { display: none; }
  #yt iframe { width: 100%; height: 100%; border: 0; border-radius: 6px; display: block; pointer-events: none; }
  #yt { cursor: pointer; }
  body.ytmode #video, body:not(.ytmode) #yt { display: none; }
  .row { display: flex; gap: 10px; width: min(640px, 92vw); }
  .row input { flex: 1; font: inherit; font-size: 17px; color: var(--fg); background: #111; border: 1.5px solid var(--line);
    border-radius: 999px; padding: 0 18px; min-height: 44px; outline: none; }
  .row input:focus { border-color: var(--accent); }
  .hint { font-size: 14px; color: var(--dim); max-width: 560px; }
</style>
</head>
<body>
<div id="stage" style="--size:72;--ratio:16/9;--spread:1.8;--amount:1">
  <canvas id="glow" width="16" height="9"></canvas>
  <video id="video" playsinline></video>
  <div id="yt"><div id="ytp"></div></div>
</div>

<div id="pick">
  <div class="title">Ambient Video</div>
  <div class="sub">Pick a video from this device, or paste a YouTube link</div>
  <button class="btn primary" id="open" autofocus>Choose video</button>
  <div class="row">
    <input id="ytlink" placeholder="YouTube link" autocomplete="off" spellcheck="false">
    <button class="btn primary" id="ytgo">Play</button>
  </div>
  <div class="hint">YouTube needs Chrome on a computer. Chrome will ask to share <b>this tab</b> — that is how the glow reads the colours.</div>
</div>

<div id="bar" hidden>
  <div class="seek">
    <span id="cur">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position">
    <span id="dur">0:00</span>
  </div>
  <div class="btns">
    <button class="btn round" id="back" aria-label="Back 10 seconds">
      <svg viewBox="0 0 24 24"><path d="M11 6L5 12l6 6"/><path d="M19 6l-6 6 6 6"/></svg><b>10</b>
    </button>
    <button class="btn round big" id="play" aria-label="Pause">
      <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14M16 5v14"/></svg>
    </button>
    <button class="btn round" id="fwd" aria-label="Forward 10 seconds">
      <b>10</b><svg viewBox="0 0 24 24"><path d="M5 6l6 6-6 6"/><path d="M13 6l6 6-6 6"/></svg>
    </button>
    <span class="gap"></span>
    <label class="ctl">Glow <input type="range" id="amount" min="0" max="100" value="100"></label>
    <label class="ctl">Size <input type="range" id="size" min="35" max="80" value="72"></label>
    <button class="btn" id="open2">Other video</button>
    <button class="btn" id="full">Full screen</button>
  </div>
</div>

<input type="file" id="file" accept="video/*">

<script>
// Ambient Video: plays a local video and lights up the space around it with the
// colours at the very edge of the picture (an Ambilight). Each update reads only
// a thin strip along each edge (the outer ~2% of the frame), averages it into
// segments, and paints those colours outward into a 16x9 canvas that is
// stretched up behind the video. Colours ease toward each new frame so the glow
// never flickers.
const $ = (id) => document.getElementById(id);
const video = $('video'), glow = $('glow'), stage = $('stage');
const g = glow.getContext('2d', { alpha: false });
const GW = glow.width, GH = glow.height;
const out = g.createImageData(GW, GH);
// Small copy of the frame we read the edges from: 1 px here = ~2% of the frame.
const SW = 96, SH = 54, EDGE = 1;
const sc = document.createElement('canvas'); sc.width = SW; sc.height = SH;
const s = sc.getContext('2d', { willReadFrequently: true });
const cur = new Float32Array(GW * GH * 3); // eased colours, 0..255
let last = 0;

// Average the edge strip into n segments along one side.
function strip(px, n, side) {
  const res = [];
  for (let k = 0; k < n; k++) {
    let r = 0, gg = 0, b = 0, c = 0;
    const horiz = side === 'top' || side === 'bottom';
    const len = horiz ? SW : SH;
    const a0 = Math.floor((k * len) / n), a1 = Math.floor(((k + 1) * len) / n);
    for (let a = a0; a < a1; a++) {
      for (let d = 0; d < EDGE; d++) {
        const x = horiz ? a : side === 'left' ? d : SW - 1 - d;
        const y = horiz ? (side === 'top' ? d : SH - 1 - d) : a;
        const i = (y * SW + x) * 4;
        r += px[i]; gg += px[i + 1]; b += px[i + 2]; c++;
      }
    }
    res.push([r / c, gg / c, b / c]);
  }
  return res;
}

// Make the colour livelier: more saturation, a bit brighter.
function boost([r, gg, b]) {
  const l = 0.299 * r + 0.587 * gg + 0.114 * b;
  return [r, gg, b].map((v) => Math.max(0, Math.min(255, (l + (v - l) * 1.8) * 1.3)));
}

function sampleEdges() {
  if (mode === 'yt') {
    // Cut the YouTube player's rectangle out of the capture of this tab.
    const r = $('yt').getBoundingClientRect();
    const kx = cap.videoWidth / innerWidth, ky = cap.videoHeight / innerHeight;
    s.drawImage(cap, (r.left + 2) * kx, (r.top + 2) * ky, (r.width - 4) * kx, (r.height - 4) * ky, 0, 0, SW, SH);
  } else s.drawImage(video, 0, 0, SW, SH);
  const px = s.getImageData(0, 0, SW, SH).data;
  const top = strip(px, GW, 'top'), bottom = strip(px, GW, 'bottom');
  const left = strip(px, GH, 'left'), right = strip(px, GH, 'right');
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      // Each cell takes the colour of the nearest edge, so colour radiates outward.
      const dx = Math.min(x, GW - 1 - x) / (GW - 1), dy = Math.min(y, GH - 1 - y) / (GH - 1);
      let col;
      if (dx < dy) col = x < GW / 2 ? left[y] : right[y];
      else col = y < GH / 2 ? top[x] : bottom[x];
      col = boost(col);
      const j = (y * GW + x) * 3, o = (y * GW + x) * 4;
      for (let c = 0; c < 3; c++) {
        cur[j + c] += (col[c] - cur[j + c]) * 0.35;
        out.data[o + c] = cur[j + c];
      }
      out.data[o + 3] = 255;
    }
  }
  g.putImageData(out, 0, 0);
}
let url = null;

function openPicker() { $('file').click(); }

// YouTube mode: the video plays in YouTube's own player (so every control works),
// and the glow reads its colours from a capture of this tab, cropped to the player.
// DRM sites (Netflix, HBO) can't work this way: their picture captures as black.
let mode = 'file', yt = null, cap = document.createElement('video'), capStream = null, ytTimer = null;
cap.muted = true; cap.playsInline = true;
function ytId(t) {
  t = t.trim();
  const m = t.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/) || t.match(/^([\w-]{11})$/);
  const l = t.match(/[?&]list=([\w-]+)/);
  return m ? { id: m[1], list: l && l[1] } : null;
}
function stopYT() {
  if (capStream) { capStream.getTracks().forEach((x) => x.stop()); capStream = null; }
  if (yt) { yt.destroy(); yt = null; $('yt').innerHTML = '<div id="ytp"></div>'; }
  clearInterval(ytTimer); mode = 'file'; document.body.classList.remove('ytmode');
}
let apiReady = null;
function loadAPI() {
  if (!apiReady) apiReady = new Promise((res) => {
    window.onYouTubeIframeAPIReady = res;
    const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(sc);
  });
  return apiReady;
}
async function playYT() {
  const v = ytId($('ytlink').value);
  if (!v) { $('ytlink').focus(); $('ytlink').placeholder = 'Paste a YouTube link here'; $('ytlink').value = ''; return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) { alert('YouTube mode needs Chrome on a computer.'); return; }
  let st;
  try {
    st = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 15 }, audio: false,
      preferCurrentTab: true, selfBrowserSurface: 'include', surfaceSwitching: 'exclude' });
  } catch (e) { return; }
  stopYT(); video.pause();
  capStream = st; cap.srcObject = st; cap.play();
  st.getVideoTracks()[0].onended = () => { stopYT(); showPick(); };
  mode = 'yt'; document.body.classList.add('ytmode');
  stage.style.setProperty('--ratio', '16/9');
  $('pick').hidden = true; $('bar').hidden = false;
  await loadAPI();
  yt = new YT.Player('ytp', {
    videoId: v.id,
    playerVars: Object.assign({ autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, fs: 0, disablekb: 1, controls: 0, iv_load_policy: 3 }, v.list ? { list: v.list } : {}),
    events: { onStateChange: (e) => setIcon(e.data !== YT.PlayerState.PLAYING) }
  });
  ytTimer = setInterval(() => {
    if (!yt || !yt.getDuration) return;
    const t = yt.getCurrentTime(), d = yt.getDuration();
    $('cur').textContent = fmt(t); $('dur').textContent = fmt(d);
    if (!dragging && d) $('seek').value = (t / d) * 1000;
  }, 250);
  wake();
}
$('ytgo').onclick = playYT;
$('yt').onclick = togglePlay;
video.onclick = togglePlay;
document.addEventListener('dblclick', (e) => { if (e.target.closest('#stage')) $('full').click(); });
$('ytlink').onkeydown = (e) => { if (e.key === 'Enter') playYT(); };
function showPick() { video.pause(); $('pick').hidden = false; $('bar').hidden = true; document.body.classList.remove('idle'); }
const playing = () => mode === 'yt' ? yt && yt.getPlayerState && yt.getPlayerState() === 1 : !video.paused;
const now = () => mode === 'yt' ? (yt && yt.getCurrentTime ? yt.getCurrentTime() : 0) : video.currentTime;
const dur = () => mode === 'yt' ? (yt && yt.getDuration ? yt.getDuration() : 0) : video.duration;
function seekTo(t) { t = Math.max(0, Math.min(dur() || 0, t)); if (mode === 'yt') { yt && yt.seekTo(t, true); } else video.currentTime = t; }
function togglePlay() { if (mode === 'yt') { if (!yt || !yt.getPlayerState) return; playing() ? yt.pauseVideo() : yt.playVideo(); } else video.paused ? video.play() : video.pause(); }
$('open').onclick = openPicker;
$('open2').onclick = () => { stopYT(); showPick(); };

$('file').onchange = () => {
  const f = $('file').files[0];
  if (!f) return;
  if (url) URL.revokeObjectURL(url);
  stopYT();
  url = URL.createObjectURL(f);
  video.src = url;
  video.play();
  $('pick').hidden = true;
  $('bar').hidden = false;
  wake();
};

video.onloadedmetadata = () => {
  if (video.videoWidth) stage.style.setProperty('--ratio', video.videoWidth + '/' + video.videoHeight);
};

// ~12 updates a second is plenty for a glow and keeps the device cool.
function paint() {
  const now = performance.now();
  const ok = mode === 'yt'
    ? cap.readyState >= 2 && cap.videoWidth && document.body.classList.contains('idle')
    : video.readyState >= 2 && !video.paused;
  if (ok && now - last > 80) {
    sampleEdges();
    last = now;
  }
  requestAnimationFrame(paint);
}
paint();

// Controls
$('play').onclick = togglePlay;
const PAUSE = '<path d="M8 5v14M16 5v14"/>', PLAY = '<path d="M7 5l12 7-12 7z"/>';
function setIcon(paused) {
  $('playIcon').innerHTML = paused ? PLAY : PAUSE; $('play').setAttribute('aria-label', paused ? 'Play' : 'Pause');
  if (paused) wake();
}
video.onplay = () => setIcon(false);
video.onpause = () => setIcon(true);
$('back').onclick = () => seekTo(now() - 10);
$('fwd').onclick = () => seekTo(now() + 10);

// Position bar
const fmt = (t) => { t = Math.floor(t || 0); const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
let dragging = false;
video.ontimeupdate = () => {
  if (mode === 'yt') return;
  $('cur').textContent = fmt(video.currentTime);
  if (!dragging && video.duration) $('seek').value = (video.currentTime / video.duration) * 1000;
};
video.ondurationchange = () => ($('dur').textContent = fmt(video.duration));
$('seek').oninput = (e) => { dragging = true; const d = dur(); if (d) { seekTo((e.target.value / 1000) * d); $('cur').textContent = fmt((e.target.value / 1000) * d); } };
$('seek').onchange = () => (dragging = false);
$('amount').oninput = (e) => stage.style.setProperty('--amount', e.target.value / 100);
$('size').oninput = (e) => stage.style.setProperty('--size', e.target.value);
$('full').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};
document.addEventListener('fullscreenchange', () => {
  $('full').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
});

// Hide controls after 3 s without input
let idleT;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleT);
  idleT = setTimeout(() => { if (playing()) document.body.classList.add('idle'); }, 3000);
}
['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach((ev) => document.addEventListener(ev, wake, { passive: true }));

// Remote / keyboard: Space or Enter on the video toggles play, arrows seek
document.addEventListener('keydown', (e) => {
  if ($('pick').hidden === false) return;
  if (e.key === ' ' && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); $('play').click(); }
  if (e.key === 'ArrowRight' && e.target.type !== 'range') seekTo(now() + 10);
  if (e.key === 'ArrowLeft' && e.target.type !== 'range') seekTo(now() - 10);
});
</script>
</body>
</html>
