<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glance Pay – test codes</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; box-sizing: border-box; font-family: system-ui, sans-serif; background: #f2f2ef; color: #111; text-align: center; }
  h1 { margin: 0; font-size: 24px; }
  p { margin: 0; color: #444; }
  #qr img { width: min(320px, 80vw); height: auto; image-rendering: pixelated; }
  .tabs { display: flex; gap: 8px; }
  .tabs button { font: inherit; padding: 10px 16px; border-radius: 999px; border: 1px solid #111; background: transparent; color: #111; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: #111; color: #fff; }
  form { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  form[hidden], [hidden] { display: none !important; }
  input[type="color"] { width: 140px; height: 42px; padding: 2px; }
  .card { width: min(340px, 86vw); aspect-ratio: 1.586; border-radius: 18px; padding: 18px 20px; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr; gap: 8px; text-align: left; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .card-name { font-weight: 700; font-size: 22px; }
  .card-num { grid-column: 1; align-self: end; font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  .card-qr { grid-row: 1 / 3; grid-column: 2; align-self: end; background: #fff; padding: 6px; border-radius: 8px; }
  .card-qr img { width: 92px; height: 92px; display: block; image-rendering: pixelated; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; text-align: left; }
  input, select { font: inherit; padding: 8px 10px; border: 1px solid #999; border-radius: 8px; width: 140px; background: #fff; }
  form button { font: inherit; padding: 8px 14px; border-radius: 8px; border: none; background: #111; color: #fff; cursor: pointer; align-self: flex-end; }
</style>
</head>
<body>
  <div class="tabs">
    <button type="button" id="tPay" aria-pressed="true">Pay code</button>
    <button type="button" id="tCard" aria-pressed="false">Test card</button>
  </div>
  <h1 id="h">Pay code</h1>
  <p id="hint">Scan this from “Scan to pay”.</p>
  <div id="qr"></div>
  <div id="card" class="card" hidden>
    <div class="card-name" id="cardTitle">Visa</div>
    <div class="card-qr" id="cardQr"></div>
    <div class="card-num" id="cardNum">•• 08</div>
  </div>

  <form id="fPay">
    <label>Shop<input id="m" value="Demo Café"></label>
    <label>Amount (€)<input id="a" value="3.80" inputmode="decimal"></label>
    <label>Item<input id="i" value="Flat white"></label>
    <button>Update</button>
  </form>

  <form id="fCard" hidden>
    <label>Brand
      <select id="b">
        <option>Visa</option>
        <option>Mastercard</option>
        <option>Amex</option>
      </select>
    </label>
    <label>Last 2 digits<input id="l" value="08" maxlength="2" inputmode="numeric"></label>
    <label>Card colour<input id="bg" type="color" value="#1E8A4C"></label>
    <label>Print colour<input id="fg" type="color" value="#FFFFFF"></label>
    <button>Update</button>
  </form>

<script>
  let mode = 'pay';
  const $ = (id) => document.getElementById(id);

  function setMode(m) {
    mode = m;
    $('tPay').setAttribute('aria-pressed', m === 'pay');
    $('tCard').setAttribute('aria-pressed', m === 'card');
    $('fPay').hidden = m !== 'pay';
    $('fCard').hidden = m !== 'card';
    $('qr').hidden = m !== 'pay';
    $('card').hidden = m !== 'card';
    $('h').textContent = m === 'pay' ? 'Pay code' : 'Test card';
    $('hint').textContent = m === 'pay'
      ? 'Scan this from “Scan to pay”.'
      : 'Hold this up in “Add a card” and press Capture. Not a real card.';
    draw();
  }

  function qrImg(text, cell, margin) {
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    return qr.createImgTag(cell, margin);
  }

  function draw() {
    const enc = encodeURIComponent;
    if (mode === 'pay') {
      $('qr').innerHTML = qrImg('glancepay:pay?m=' + enc($('m').value) + '&a=' + enc($('a').value.replace(',', '.')) + '&c=EUR&i=' + enc($('i').value), 8, 16);
      return;
    }
    const card = $('card');
    card.style.background = $('bg').value;
    card.style.color = $('fg').value;
    $('cardTitle').textContent = $('b').value;
    $('cardNum').textContent = '•• ' + $('l').value;
    $('cardQr').innerHTML = qrImg('glancepay:card?b=' + enc($('b').value) + '&l=' + enc($('l').value), 3, 2);
  }
  ['bg', 'fg', 'b', 'l'].forEach((id) => $(id).addEventListener('input', draw));

  $('tPay').addEventListener('click', () => setMode('pay'));
  $('tCard').addEventListener('click', () => setMode('card'));
  $('fPay').addEventListener('submit', (e) => { e.preventDefault(); draw(); });
  $('fCard').addEventListener('submit', (e) => { e.preventDefault(); draw(); });
  draw();
</script>
</body>
</html>
